<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5a33">
  <title data-i18n="meta.plan">SawahKu</title>
  <meta name="description" content="SawahKu: your paddy field schedule — when to fertilise, water levels, field checks and harvest, from your sowing date (Rice Check 2022).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="plan">

  <header id="site-header"></header>

  <main id="plan-app">
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="plan.title"></h1>
        <p data-i18n="plan.lead"></p>
      </div>
    </section>

    <section class="section" style="padding-top:22px">
      <div class="container">
        <div class="card plan-setup-card">
          <div class="plan-setup">
            <div class="field">
              <label for="plan-sow" data-i18n="plan.sow"></label>
              <input type="date" id="plan-sow">
            </div>
            <div class="field">
              <label for="plan-size" data-i18n="plan.size"></label>
              <div class="plan-size">
                <input type="number" id="plan-size" min="0" step="0.5" inputmode="decimal" placeholder="3">
                <select id="plan-unit" data-i18n-aria="plan.unit">
                  <option value="relung" data-i18n="plan.unit.relung"></option>
                  <option value="acre" data-i18n="plan.unit.acre"></option>
                  <option value="ha" data-i18n="plan.unit.ha"></option>
                </select>
              </div>
            </div>
            <p class="note" data-i18n="plan.saved"></p>
          </div>
        </div>

        <div class="card plan-today" id="plan-today" aria-live="polite"></div>

        <div class="plan-actions" id="plan-actions" hidden>
          <button type="button" class="btn btn--green" id="plan-ics"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span data-i18n="plan.ics"></span></button>
          <button type="button" class="btn btn--outline btn--sm" id="plan-share"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.1.1.3 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg><span data-i18n="plan.share"></span></button>
          <button type="button" class="btn btn--outline btn--sm" id="plan-print"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg><span data-i18n="plan.print"></span></button>
          <p class="note" data-i18n="plan.icsNote"></p>
        </div>

        <div class="plan-filters" id="plan-filters" role="group" data-i18n-aria="plan.filterAria"></div>
        <div class="plan-list" id="plan-list"></div>

        <div class="callout callout--warn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
          <span data-i18n-html="plan.ipm"></span>
        </div>
        <div class="callout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span data-i18n-html="plan.source"></span>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
