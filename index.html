<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5a33">
  <title data-i18n="meta.home">SawahKu</title>
  <meta name="description" content="SawahKu: weather, AI assistant, pest and disease info and a community for paddy farmers, in Malay and English.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">

  <header id="site-header"></header>

  <main>
    <section class="home-top">
      <div class="container">
        <h1 id="greeting"></h1>
        <p data-i18n="home.sub"></p>
      </div>
    </section>

    <div class="container home-body">
      <a class="card today" id="wx-mini" href="weather.html" aria-label="Cuaca"></a>
      <a class="plan-mini" id="plan-mini" href="jadual.html"></a>

      <div class="tiles">
        <a class="tile tile--weather" href="weather.html"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M8 2v1.5M2 8h1.5M3.8 3.8l1 1M12.2 3.8l-1 1"/><path d="M9 20h9a4 4 0 0 0 0-8 6 6 0 0 0-10.5 2.5A3 3 0 0 0 9 20z"/></svg></span><strong data-i18n="home.weatherT"></strong><span data-i18n="home.weatherS"></span></a>
        <a class="tile tile--ask" href="ask.html"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.2M12 16.5h.01"/></svg></span><strong data-i18n="home.askT"></strong><span data-i18n="home.askS"></span></a>
        <a class="tile tile--crop" href="crop.html"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V10"/><path d="M12 14c-4-.5-6-3-6-7 4 .3 6 3 6 7zM12 11c4-.5 6-3 6-7-4 .3-6 3-6 7z"/><path d="M8 21h8"/></svg></span><strong data-i18n="home.cropT"></strong><span data-i18n="home.cropS"></span></a>
        <a class="tile tile--forum" href="forum.html"><span class="tile__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h2a2 2 0 0 1 2 2v9l-3-2h-7a2 2 0 0 1-2-2v-1"/><path d="M15 4H5a2 2 0 0 0-2 2v9l3-2h9a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/></svg></span><strong data-i18n="home.forumT"></strong><span data-i18n="home.forumS"></span></a>
      </div>

      <section class="card" style="margin-top:16px">
        <h2 style="font-size:1.25rem" data-i18n="home.askTitle"></h2>
        <form class="ask-box" id="home-ask" action="ask.html">
          <input class="input" type="text" name="q" data-i18n-ph="home.askPh" autocomplete="off" aria-label="Soalan">
          <a class="icon-btn icon-btn--mic" href="ask.html?mic=1" data-i18n-aria="ask.mic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></a>
          <button class="icon-btn icon-btn--send" type="submit" data-i18n-aria="ask.send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg></button>
        </form>
      </section>

      <section class="card official-card" style="margin-top:16px">
        <div class="head-row"><h2 data-i18n="home.agTitle"></h2><a href="info.html" data-i18n="home.agAll"></a></div>
        <div class="agency-quick-grid" id="home-agencies"></div>
        <a class="why-banner why-banner--sm" href="info.html#why">
          <span class="why-banner__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.2M12 16.5h.01"/></svg></span>
          <span><strong data-i18n="info.whyT"></strong><small data-i18n="info.whyS"></small></span>
        </a>
      </section>

      <section class="card" style="margin-top:16px">
        <div class="head-row"><h2 data-i18n="home.learnTitle"></h2><a href="learn.html" data-i18n="common.seeAll"></a></div>
        <div id="home-learn"></div>
      </section>

      <div class="grid grid--2" style="margin-top:16px;align-items:start">
        <section class="card">
          <div class="head-row"><h2 data-i18n="home.forumTitle"></h2><a href="forum.html" data-i18n="common.seeAll"></a></div>
          <div id="home-forum"></div>
        </section>
        <section>
          <div class="head-row" style="padding:0 4px"><h2 data-i18n="home.newsTitle"></h2></div>
          <div class="grid" id="news-list" data-limit="2" style="margin-top:8px"></div>
        </section>
      </div>
    </div>
  </main>

  <script>
    // Greeting by time of day
    document.addEventListener("DOMContentLoaded", function () {
      function greet() {
        var h = new Date().getHours();
        document.getElementById("greeting").textContent = APP.t(h < 12 ? "home.morning" : h < 15 ? "home.afternoon" : h < 19 ? "home.evening" : "home.night");
      }
      greet();
      document.addEventListener("langchange", greet);
    });
  </script>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/news.js"></script>
  <script src="js/forum.js"></script>
  <script src="js/ebooks.js"></script>
  <script src="js/learn.js"></script>
  <script src="js/info.js"></script>
</body>
</html>
