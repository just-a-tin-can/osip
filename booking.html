<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.booking">Book a Drone Service — ADP Sytech</title>
  <meta name="description" content="Book an ADP Sytech drone fertiliser spreading or pesticide spraying service for your paddy field.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="booking">

  <header id="site-header"></header>

  <main class="book-app">
    <div class="container book-wrap">

      <h1 class="book-title" data-i18n="bk.title"></h1>

      <!-- Tabs: new booking / my bookings (like Grab's "Orders") -->
      <div class="book-tabs" role="tablist">
        <button type="button" role="tab" id="tab-new" aria-selected="true" aria-controls="panel-new" data-i18n="bk.tabNew"></button>
        <button type="button" role="tab" id="tab-orders" aria-selected="false" aria-controls="panel-orders"><span data-i18n="bk.tabOrders"></span> <span class="count" id="orders-count"></span></button>
        <button type="button" role="tab" id="tab-feedback" aria-selected="false" aria-controls="panel-feedback" data-i18n="bk.tabFeedback"></button>
      </div>

      <!-- ================= NEW BOOKING ================= -->
      <div id="panel-new" role="tabpanel">
        <span class="demo-flag" data-i18n="book.demo"></span>

        <!-- Quick option for farmers who find forms hard -->
        <div class="wa-card">
          <p><strong data-i18n="wa.cardTitle"></strong><span data-i18n="wa.cardText"></span></p>
          <a class="btn btn--wa btn--block" id="wa-quick" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg><span data-i18n="wa.cardBtn"></span></a>
        </div>

        <ol class="stepper" id="stepper">
          <li data-go="1"><b>1</b><span data-i18n="bk.step1"></span></li>
          <li data-go="2"><b>2</b><span data-i18n="bk.step2"></span></li>
          <li data-go="3"><b>3</b><span data-i18n="bk.step3"></span></li>
          <li data-go="4"><b>4</b><span data-i18n="bk.step4"></span></li>
        </ol>

        <form id="booking-form" novalidate>

          <!-- STEP 1: WHERE -->
          <section class="step card" data-step="1">
            <h2 data-i18n="bk.q1"></h2>
            <button type="button" class="btn btn--green btn--lg btn--block" id="loc-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
              <span data-i18n="book.locBtn"></span>
            </button>
            <p class="note" style="margin-top:8px" data-i18n="book.locHint"></p>
            <p class="loc-status" id="loc-status" role="status"></p>

            <div class="field" style="margin-top:18px" id="where-field">
              <label for="b-village" data-i18n="bk.village"></label>
              <input type="text" id="b-village" data-i18n-ph="bk.villagePh" autocomplete="address-level2">
              <div class="error" data-i18n="bk.err.where"></div>
            </div>
            <div class="field" style="margin-top:14px">
              <label for="b-lot"><span data-i18n="book.lot"></span> <span class="hint" data-i18n="book.optional"></span></label>
              <input type="text" id="b-lot" data-i18n-ph="book.lotPh">
            </div>
          </section>

          <!-- STEP 2: WHAT -->
          <section class="step card" data-step="2" hidden>
            <h2 data-i18n="bk.q2"></h2>

            <div class="field" id="service-field">
              <div class="tiles" role="radiogroup">
                <div class="tile">
                  <input type="radio" id="svc-fert" name="service" value="fert">
                  <label for="svc-fert">
                    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M9 6h14l2 5v15a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V11z" opacity=".25"/><path d="M9 6h14l2 5H7z"/><circle cx="13" cy="18" r="1.8"/><circle cx="19" cy="18" r="1.8"/><circle cx="16" cy="22.5" r="1.8"/></svg>
                    <span data-i18n="book.svc.fert"></span>
                  </label>
                </div>
                <div class="tile">
                  <input type="radio" id="svc-pest" name="service" value="pest">
                  <label for="svc-pest">
                    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 4c-4 6-8.5 11-8.5 16a8.5 8.5 0 0 0 17 0C24.5 15 20 10 16 4z"/></svg>
                    <span data-i18n="book.svc.pest"></span>
                  </label>
                </div>
                <div class="tile">
                  <input type="radio" id="svc-both" name="service" value="both">
                  <label for="svc-both">
                    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M5 10h11l1.5 4v11a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 25V14z" opacity=".35"/><path d="M23 5c-3 4.5-6 8-6 11.5a6 6 0 0 0 12 0C29 13 26 9.5 23 5z"/></svg>
                    <span data-i18n="book.svc.both"></span>
                  </label>
                </div>
              </div>
              <div class="error" data-i18n="book.err.service"></div>
            </div>

            <div class="field" id="pestform-field" hidden style="margin-top:18px">
              <label data-i18n="book.pestForm"></label>
              <div class="tiles tiles--2" role="radiogroup">
                <div class="tile">
                  <input type="radio" id="pf-granular" name="pestForm" value="granular">
                  <label for="pf-granular">
                    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><circle cx="9" cy="20" r="3"/><circle cx="16" cy="24" r="3"/><circle cx="23" cy="20" r="3"/><circle cx="12.5" cy="13" r="2.6"/><circle cx="19.5" cy="13" r="2.6"/><circle cx="16" cy="6.5" r="2.2"/></svg>
                    <span data-i18n="book.pestForm.granular"></span>
                  </label>
                </div>
                <div class="tile">
                  <input type="radio" id="pf-liquid" name="pestForm" value="liquid">
                  <label for="pf-liquid">
                    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M16 3c-4 6-9 11.5-9 17a9 9 0 0 0 18 0c0-5.5-5-11-9-17z"/></svg>
                    <span data-i18n="book.pestForm.liquid"></span>
                  </label>
                </div>
              </div>
              <div class="error" data-i18n="book.err.pestForm"></div>
            </div>

            <div class="field" id="size-field" style="margin-top:18px">
              <label for="b-size" data-i18n="bk.size"></label>
              <div class="stepper-input">
                <button type="button" class="qty" data-qty="-1" aria-label="−">−</button>
                <input type="number" id="b-size" min="0.5" step="0.5" inputmode="decimal">
                <button type="button" class="qty" data-qty="1" aria-label="+">+</button>
                <select id="b-unit" aria-label="Unit">
                  <option value="acre" data-i18n="guide.unit.acre"></option>
                  <option value="relung" data-i18n="guide.unit.relung"></option>
                  <option value="ha" data-i18n="guide.unit.ha"></option>
                </select>
              </div>
              <div class="error" data-i18n="book.err.size"></div>
            </div>

            <div class="field" style="margin-top:18px">
              <label for="b-product"><span data-i18n="book.product"></span> <span class="hint" data-i18n="book.optional"></span></label>
              <input type="text" id="b-product" data-i18n-ph="book.productPh">
              <p class="note" style="margin-top:6px" data-i18n="book.productHint"></p>
            </div>

            <div class="callout" style="margin-top:14px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
              <span data-i18n="book.ownSupply"></span>
            </div>
          </section>

          <!-- STEP 3: WHEN -->
          <section class="step card" data-step="3" hidden>
            <h2 data-i18n="bk.q3"></h2>
            <div class="field" id="date-field">
              <label data-i18n="bk.date"></label>
              <div class="chips" id="date-chips"></div>
              <div class="error" data-i18n="bk.err.date"></div>
            </div>
            <div class="field" id="slot-field" style="margin-top:18px">
              <label data-i18n="bk.time"></label>
              <div class="slots" id="slots"></div>
              <p class="note" style="margin-top:6px" data-i18n="book.slotHint"></p>
              <div class="error" data-i18n="book.err.slot"></div>
            </div>
            <p class="note" style="margin-top:14px"><span data-i18n="book.weatherTip"></span> <a href="updates.html#weather" data-i18n="book.weatherLink"></a></p>
          </section>

          <!-- STEP 4: CONFIRM -->
          <section class="step card" data-step="4" hidden>
            <h2 data-i18n="bk.q4"></h2>
            <ul class="summary-list review-list" id="summary"></ul>

            <h3 class="form-section-title" style="margin-top:22px" data-i18n="bk.you"></h3>
            <div class="field" style="margin-top:12px">
              <label for="b-name" data-i18n="book.name"></label>
              <input type="text" id="b-name" autocomplete="name" data-i18n-ph="book.namePh">
              <div class="error" data-i18n="book.err.name"></div>
            </div>
            <div class="field" style="margin-top:14px">
              <label for="b-phone" data-i18n="book.phone"></label>
              <input type="tel" id="b-phone" autocomplete="tel" inputmode="tel" data-i18n-ph="book.phonePh">
              <div class="error" data-i18n="book.err.phone"></div>
            </div>
            <p class="note" style="margin-top:6px" data-i18n="bk.remember"></p>

            <details class="more" style="margin-top:10px">
              <summary data-i18n="book.notes"></summary>
              <textarea id="b-notes" rows="3" data-i18n-ph="book.notesPh"></textarea>
            </details>

            <div class="callout" style="margin-top:14px">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg>
              <span data-i18n="bk.trust"></span>
            </div>

            <div class="field" id="consent-field" style="margin-top:14px">
              <label style="display:flex;gap:10px;align-items:flex-start;font-weight:500;cursor:pointer">
                <input type="checkbox" id="b-consent" style="width:22px;height:22px;margin-top:2px;flex-shrink:0">
                <span data-i18n="book.consent"></span>
              </label>
              <div class="error" data-i18n="book.err.consent"></div>
            </div>
          </section>

          <!-- Back / Next (sticks to the bottom on phones) -->
          <div class="step-nav">
            <button type="button" class="btn btn--outline" id="back-btn" data-i18n="bk.back"></button>
            <button type="button" class="btn btn--primary btn--lg btn--glow" id="next-btn"><span data-i18n="bk.next"></span></button>
          </div>
        </form>
      </div>

      <!-- ================= MY BOOKINGS ================= -->
      <div id="panel-orders" role="tabpanel" hidden>
        <div class="orders" id="orders"></div>
      </div>

      <!-- ================= FEEDBACK (direct link: booking.html#feedback) ================= -->
      <div id="panel-feedback" role="tabpanel" hidden>
        <div class="card step" id="fb-form">
          <h2 data-i18n="fb.title"></h2>
          <p class="note" style="margin-top:-8px" data-i18n="fb.lead"></p>

          <div class="field" id="fb-job-field" style="margin-top:16px">
            <label data-i18n="fb.which"></label>
            <div class="fb-jobs" id="fb-jobs"></div>
          </div>

          <div class="field" id="fb-ref-field" style="margin-top:14px">
            <label for="fb-ref"><span data-i18n="fb.ref"></span> <span class="hint" data-i18n="book.optional"></span></label>
            <input type="text" id="fb-ref" data-i18n-ph="fb.refPh" autocapitalize="characters">
          </div>

          <div class="field" id="fb-stars-field" style="margin-top:18px">
            <label data-i18n="bk.rateQ"></label>
            <div class="stars" id="fb-stars"></div>
            <div class="error" data-i18n="fb.err.stars"></div>
          </div>
          <div class="tags" id="fb-tags"></div>

          <div class="field" style="margin-top:6px">
            <label for="fb-comment"><span data-i18n="fb.comment"></span> <span class="hint" data-i18n="book.optional"></span></label>
            <textarea id="fb-comment" rows="3" data-i18n-ph="fb.commentPh"></textarea>
          </div>
          <div class="field" style="margin-top:14px">
            <label for="fb-name"><span data-i18n="book.name"></span> <span class="hint" data-i18n="book.optional"></span></label>
            <input type="text" id="fb-name" autocomplete="name" data-i18n-ph="book.namePh">
          </div>

          <button type="button" class="btn btn--primary btn--lg btn--block btn--glow" style="margin-top:18px" id="fb-send" data-i18n="fb.send"></button>
        </div>

        <div class="card fb-thanks" id="fb-thanks" hidden>
          <div class="modal__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></div>
          <h2 data-i18n="fb.thanksTitle"></h2>
          <p data-i18n="bk.thanks"></p>
          <button type="button" class="btn btn--outline" id="fb-again" data-i18n="fb.again"></button>
        </div>

        <div class="fb-history">
          <div class="rating-summary" id="rating-summary"></div>
          <div class="orders" id="fb-list"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ============ CONFIRMATION ============ -->
  <div class="modal" id="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal__box">
      <div class="modal__icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>
      </div>
      <h2 id="confirm-title" data-i18n="book.okTitle"></h2>
      <p data-i18n="book.okText" style="margin-bottom:0"></p>
      <div class="ref-big" id="confirm-ref"></div>
      <p class="note" data-i18n="book.okNote"></p>
      <a class="btn btn--wa btn--block btn--lg" id="confirm-wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.4.8 3.2.6a2.8 2.8 0 0 0 1.8-1.3 2.3 2.3 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg><span data-i18n="wa.send"></span></a>
      <button type="button" class="btn btn--outline btn--block" style="margin-top:10px" id="confirm-orders" data-i18n="bk.viewOrders"></button>
      <button type="button" class="btn btn--outline btn--block" style="margin-top:10px" id="confirm-close" data-i18n="book.okClose"></button>
    </div>
  </div>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
