<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.guide">Paddy Fertiliser Guide & Weather — ADP Sytech</title>
  <meta name="description" content="When to apply fertiliser and pesticide to paddy, how much to use, and a 7-day weather forecast with water advice.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="guide">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="guide.eyebrow"></span>
        <h1 data-i18n="guide.title"></h1>
        <p data-i18n="guide.lead"></p>
      </div>
    </section>

    <!-- ============ SCHEDULE ============ -->
    <section class="section" id="schedule" style="padding-top:36px">
      <div class="container">

        <div class="tool-bar">
          <div class="field">
            <label for="sow-date" data-i18n="guide.sowDate"></label>
            <input type="date" id="sow-date">
          </div>
          <div class="field">
            <label for="field-size" data-i18n="guide.fieldSize"></label>
            <div class="inline-input">
              <input type="number" id="field-size" min="0" step="0.1" value="1" inputmode="decimal">
              <select id="field-unit" aria-label="Unit">
                <option value="acre" data-i18n="guide.unit.acre"></option>
                <option value="relung" data-i18n="guide.unit.relung"></option>
                <option value="ha" data-i18n="guide.unit.ha"></option>
              </select>
            </div>
          </div>
          <div class="field">
            <label>&nbsp;</label>
            <button type="button" class="btn btn--outline" id="print-btn" data-i18n="guide.print"></button>
          </div>
        </div>

        <div class="callout" id="day-status" style="margin:0 0 20px;font-weight:600;background:var(--green-100);color:var(--green-900)"></div>

        <div class="timing-card" id="timing-card" hidden>
          <div class="timing-card__text">
            <p class="timing-card__main" id="timing-main"></p>
            <p class="timing-card__tip" data-i18n="timing.tip"></p>
          </div>
          <div class="timing-card__actions">
            <span id="timing-book"></span>
            <button type="button" class="btn btn--outline" id="ics-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span data-i18n="timing.ics"></span>
            </button>
            <span class="note" style="margin:0" data-i18n="timing.icsNote"></span>
          </div>
        </div>

        <div class="tabs" role="tablist" id="type-tabs">
          <button type="button" role="tab" data-filter="all" aria-selected="true" data-i18n="guide.tab.all"></button>
          <button type="button" role="tab" data-filter="fert" aria-selected="false" data-i18n="guide.tab.fert"></button>
          <button type="button" role="tab" data-filter="pest" aria-selected="false" data-i18n="guide.tab.pest"></button>
          <button type="button" role="tab" data-filter="water" aria-selected="false" data-i18n="guide.tab.water"></button>
        </div>

        <div class="table-wrap">
          <table class="schedule">
            <thead>
              <tr>
                <th data-i18n="guide.th.day"></th>
                <th data-i18n="guide.th.date"></th>
                <th data-i18n="guide.th.type"></th>
                <th data-i18n="guide.th.product"></th>
                <th data-i18n="guide.th.amount"></th>
                <th data-i18n="guide.th.purpose"></th>
              </tr>
            </thead>
            <tbody id="schedule-body"></tbody>
          </table>
        </div>

        <p class="note" data-i18n="guide.hltNote"></p>

        <div class="callout callout--warn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17h.01"/></svg>
          <span data-i18n="guide.pestNote"></span>
        </div>
        <div class="callout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span data-i18n="guide.source"></span>
        </div>
      </div>
    </section>

    <!-- ============ LINK TO LATEST INFO ============ -->
    <section class="section section--alt" style="padding:40px 0">
      <div class="container">
        <div class="cta-band" style="background:var(--sky-100);border-color:#bfdcef">
          <div>
            <h2 data-i18n="guide.moreTitle"></h2>
            <p data-i18n="guide.moreText"></p>
          </div>
          <a class="btn btn--green" href="updates.html" data-i18n="guide.moreBtn"></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/schedule.js"></script>
</body>
</html>
