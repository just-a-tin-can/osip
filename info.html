<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5a33">
  <title data-i18n="meta.info">SawahKu</title>
  <meta name="description" content="SawahKu: weather, AI assistant, pest and disease info and a community for paddy farmers, in Malay and English.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="info">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <h1 data-i18n="info.title"></h1>
        <p data-i18n="info.lead"></p>
      </div>
    </section>

    <section class="section" style="padding-top:22px">
      <div class="container">
        <a class="why-banner" href="#why">
          <span class="why-banner__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.2M12 16.5h.01"/></svg></span>
          <span><strong data-i18n="info.whyT"></strong><small data-i18n="info.whyS"></small></span>
        </a>

        <div class="chips info-jump" id="info-jump"></div>

        <div class="callout callout--danger emergency">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
          <span><strong data-i18n="info.emergency"></strong> <a href="tel:999">999</a> · <span data-i18n="info.poison"></span> <a href="tel:+6046536999">04-653 6999</a></span>
        </div>

        <div id="info-agencies"></div>

        <p class="note" data-i18n="info.disclaimer"></p>

        <section id="faq" class="faq-wrap">
          <h2 data-i18n="info.faqTitle"></h2>
          <div id="info-faq"></div>
        </section>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/info.js"></script>
</body>
</html>
