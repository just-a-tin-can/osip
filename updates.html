<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="meta.updates">Latest Info — ADP Sytech</title>
  <meta name="description" content="Paddy farming news, 7-day weather and pest and pesticide alerts for Malaysian paddy farmers.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="updates">

  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="container">
        <span class="eyebrow" data-i18n="upd.eyebrow"></span>
        <h1 data-i18n="upd.title"></h1>
        <p data-i18n="upd.lead"></p>
        <nav class="jump" aria-label="Sections">
          <a href="#weather"><span aria-hidden="true">🌦️</span> <span data-i18n="upd.jWeather"></span></a>
          <a href="#news"><span aria-hidden="true">📰</span> <span data-i18n="upd.jNews"></span></a>
          <a href="#pests"><span aria-hidden="true">🐛</span> <span data-i18n="upd.jPests"></span></a>
        </nav>
      </div>
    </section>

    <!-- ============ WEATHER ============ -->
    <section class="section" id="weather">
      <div class="container">
        <div class="weather-head">
          <div class="section__head" style="margin-bottom:0">
            <span class="eyebrow" data-i18n="weather.eyebrow"></span>
            <h2 data-i18n="weather.title"></h2>
            <p data-i18n="weather.lead"></p>
          </div>
          <div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap">
            <div class="field">
              <label for="wx-location" data-i18n="weather.location"></label>
              <select id="wx-location"></select>
            </div>
            <button type="button" class="btn btn--outline" id="wx-geo" data-i18n="weather.useMine"></button>
          </div>
        </div>

        <p class="weather-status" id="wx-status" role="status"></p>
        <div class="callout" id="wx-summary" style="margin:0 0 12px"></div>
        <div class="callout callout--warn" id="wx-target" style="margin:0 0 20px"></div>

        <div class="forecast" id="wx-forecast"></div>

        <div class="legend">
          <span><i style="background:var(--green-100);border:1px solid var(--green-500)"></i><span data-i18n="weather.legend.good"></span></span>
          <span><i style="background:var(--gold-100);border:1px solid var(--gold-500)"></i><span data-i18n="weather.legend.warn"></span></span>
          <span><i style="background:var(--red-100);border:1px solid var(--red-500)"></i><span data-i18n="weather.legend.bad"></span></span>
          <span><i style="background:var(--sky-100);border:1px solid var(--sky-500)"></i><span data-i18n="weather.legend.water"></span></span>
        </div>

        <h3 style="margin-top:44px" data-i18n="weather.waterTitle"></h3>
        <div class="water-stages">
          <div class="water-stage"><div class="level"><i style="height:6%"></i></div><strong data-i18n="weather.wsSat"></strong><span data-i18n="weather.ws0"></span></div>
          <div class="water-stage"><div class="level"><i style="height:35%"></i></div><strong>3–5 cm</strong><span data-i18n="weather.ws1"></span></div>
          <div class="water-stage"><div class="level"><i style="height:55%"></i></div><strong>5–7 cm</strong><span data-i18n="weather.ws2"></span></div>
          <div class="water-stage"><div class="level"><i style="height:80%"></i></div><strong>5–10 cm</strong><span data-i18n="weather.ws3"></span></div>
          <div class="water-stage"><div class="level"><i style="height:0"></i></div><strong data-i18n="weather.wsDrain"></strong><span data-i18n="weather.ws4"></span></div>
        </div>

        <p class="note" data-i18n="weather.source"></p>
      </div>
    </section>

    <!-- ============ NEWS ============ -->
    <section class="section section--alt" id="news">
      <div class="container">
        <div class="section__head">
          <span class="eyebrow" data-i18n="news.eyebrow"></span>
          <h2 data-i18n="news.title"></h2>
          <p data-i18n="news.lead"></p>
          <p class="note" id="news-updated"></p>
        </div>
        <div class="grid grid--2" id="news-list"></div>

        <h3 style="margin-top:40px" data-i18n="news.official"></h3>
        <div class="grid grid--4 sources">
          <a class="card source" href="https://www.kpkm.gov.my" target="_blank" rel="noopener"><strong>KPKM</strong><span data-i18n="news.src.kpkm"></span></a>
          <a class="card source" href="https://www.doa.gov.my" target="_blank" rel="noopener"><strong>DOA</strong><span data-i18n="news.src.doa"></span></a>
          <a class="card source" href="https://www.mardi.gov.my" target="_blank" rel="noopener"><strong>MARDI</strong><span data-i18n="news.src.mardi"></span></a>
          <a class="card source" href="https://www.met.gov.my" target="_blank" rel="noopener"><strong>MetMalaysia</strong><span data-i18n="news.src.met"></span></a>
        </div>
        <p class="note" data-i18n="news.demo"></p>
      </div>
    </section>

    <!-- ============ PESTS & DISEASES ============ -->
    <section class="section" id="pests">
      <div class="container">
        <div class="section__head">
          <span class="eyebrow" data-i18n="pests.eyebrow"></span>
          <h2 data-i18n="pests.title"></h2>
          <p data-i18n="pests.lead"></p>
        </div>
        <div class="grid grid--3">
          <article class="card pest-card">
            <header><h3 data-i18n="pests.snail.n"></h3><span class="tag tag--pest" data-i18n="pests.pest"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.snail.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.snail.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.snail.d"></dd>
            </dl>
          </article>
          <article class="card pest-card">
            <header><h3 data-i18n="pests.bph.n"></h3><span class="tag tag--pest" data-i18n="pests.pest"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.bph.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.bph.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.bph.d"></dd>
            </dl>
          </article>
          <article class="card pest-card">
            <header><h3 data-i18n="pests.borer.n"></h3><span class="tag tag--pest" data-i18n="pests.pest"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.borer.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.borer.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.borer.d"></dd>
            </dl>
          </article>
          <article class="card pest-card">
            <header><h3 data-i18n="pests.blast.n"></h3><span class="tag tag--water" data-i18n="pests.disease"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.blast.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.blast.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.blast.d"></dd>
            </dl>
          </article>
          <article class="card pest-card">
            <header><h3 data-i18n="pests.sheath.n"></h3><span class="tag tag--water" data-i18n="pests.disease"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.sheath.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.sheath.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.sheath.d"></dd>
            </dl>
          </article>
          <article class="card pest-card">
            <header><h3 data-i18n="pests.blb.n"></h3><span class="tag tag--water" data-i18n="pests.disease"></span></header>
            <dl>
              <dt data-i18n="pests.when"></dt><dd data-i18n="pests.blb.w"></dd>
              <dt data-i18n="pests.signs"></dt><dd data-i18n="pests.blb.s"></dd>
              <dt data-i18n="pests.do"></dt><dd data-i18n="pests.blb.d"></dd>
            </dl>
          </article>
        </div>
<div style="margin-top:24px">
        <div class="callout callout--danger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>
          <span data-i18n="guide.mixWarn"></span>
        </div>
        <div class="callout callout--warn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span data-i18n="pests.brandTip"></span>
        </div>
</div>
        <div class="callout" style="align-items:center;flex-wrap:wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
          <span style="flex:1;min-width:220px" data-i18n="pests.alerts"></span>
          <a class="btn btn--outline" style="padding:8px 16px;font-size:0.9rem" href="https://www.doa.gov.my" target="_blank" rel="noopener" data-i18n="pests.alertsLink"></a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/news.js"></script>
</body>
</html>
